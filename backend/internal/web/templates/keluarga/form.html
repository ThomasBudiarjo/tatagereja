{{define "content"}}
<div class="flex items-center gap-3 mb-6">
  <a href="/keluarga" class="text-gray-400 hover:text-gray-600 text-sm">← Keluarga</a>
</div>
<h1 class="text-xl font-bold text-gray-900 mb-6">{{if .IsNew}}Tambah Keluarga{{else}}Edit Keluarga{{end}}</h1>

<div id="form-container">
{{if .IsNew}}
<form method="POST" action="/keluarga" class="bg-white border border-gray-200 rounded-xl p-6 space-y-4">
{{else}}
<form method="POST" action="/keluarga/{{.ID}}" class="bg-white border border-gray-200 rounded-xl p-6 space-y-4">
{{end}}
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Keluarga <span class="text-red-500">*</span></label>
    <input name="nama_keluarga" value="{{.Form.NamaKeluarga}}"
           class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 {{if index .Errors "NamaKeluarga"}}border-red-400{{else}}border-gray-300{{end}}">
    {{with index .Errors "NamaKeluarga"}}<p class="text-xs text-red-600 mt-1">{{.}}</p>{{end}}
  </div>
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Alamat</label>
    <textarea name="alamat" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">{{.Form.Alamat}}</textarea>
  </div>
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Catatan</label>
    <textarea name="catatan" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">{{.Form.Catatan}}</textarea>
  </div>
  <div class="flex gap-3 pt-2">
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2 rounded-lg">Simpan</button>
    <a href="/keluarga" class="text-sm text-gray-600 hover:text-gray-900 px-3 py-2">Batal</a>
  </div>
</form>
</div>
{{end}}
