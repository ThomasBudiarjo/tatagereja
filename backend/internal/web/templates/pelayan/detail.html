{{define "content"}}
<div class="flex items-center gap-3 mb-6">
  <a href="/pelayan" class="text-gray-400 hover:text-gray-600 text-sm">← Pelayan</a>
</div>

<div class="bg-white border border-gray-200 rounded-xl p-6">
  <div class="flex items-start justify-between mb-4">
    <h1 class="text-2xl font-bold text-gray-900">{{.Pelayan.JemaatNama}}</h1>
    <div class="flex gap-2">
      <a href="/pelayan/{{.Pelayan.ID}}/edit" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg">Edit</a>
      <form method="POST" action="/pelayan/{{.Pelayan.ID}}/delete" onsubmit="return confirm('Hapus pelayan ini?')">
        <button type="submit" class="text-sm bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg">Hapus</button>
      </form>
    </div>
  </div>

  <div class="mb-4">
    <h2 class="text-sm font-medium text-gray-500 mb-2">Tipe Pelayanan</h2>
    <div class="flex flex-wrap gap-2">
      {{range .ServiceTypes}}
      <span class="bg-indigo-50 text-indigo-700 rounded-full px-3 py-1 text-sm">{{.Nama}}</span>
      {{else}}
      <span class="text-gray-400 text-sm">Belum ada tipe pelayanan.</span>
      {{end}}
    </div>
  </div>

  {{if .Pelayan.Catatan.Valid}}
  <div>
    <h2 class="text-sm font-medium text-gray-500 mb-1">Catatan</h2>
    <p class="text-sm text-gray-700">{{.Pelayan.Catatan.String}}</p>
  </div>
  {{end}}
</div>
{{end}}
