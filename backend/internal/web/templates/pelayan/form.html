{{define "content"}}
<div class="flex items-center gap-3 mb-6">
  <a href="/pelayan" class="text-gray-400 hover:text-gray-600 text-sm">← Pelayan</a>
</div>
<h1 class="text-xl font-bold text-gray-900 mb-6">{{if .IsNew}}Tambah Pelayan{{else}}Edit Pelayan{{end}}</h1>

<div id="form-container">
{{if .IsNew}}
<form method="POST" action="/pelayan" class="bg-white border border-gray-200 rounded-xl p-6 space-y-4">
{{else}}
<form method="POST" action="/pelayan/{{.ID}}" class="bg-white border border-gray-200 rounded-xl p-6 space-y-4">
{{end}}
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Jemaat <span class="text-red-500">*</span></label>
    <select name="jemaat_id" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 {{if index .Errors "JemaatID"}}border-red-400{{else}}border-gray-300{{end}}">
      <option value="">— Pilih Jemaat —</option>
      {{range .Jemaats}}
      <option value="{{.ID}}" {{if eq (printf "%d" .ID) $.Form.JemaatID}}selected{{end}}>
        {{.NamaLengkap}}{{if .NamaPanggilan.Valid}} ({{.NamaPanggilan.String}}){{end}}
      </option>
      {{end}}
    </select>
    {{with index .Errors "JemaatID"}}<p class="text-xs text-red-600 mt-1">{{.}}</p>{{end}}
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-2">Tipe Pelayanan</label>
    <div class="space-y-2">
      {{range .ServiceTypes}}
      <label class="flex items-center gap-2 text-sm cursor-pointer">
        {{$stID := printf "%d" .ID}}
        <input type="checkbox" name="service_type_ids" value="{{.ID}}"
               {{range $.Form.ServiceTypeIDs}}{{if eq . $stID}}checked{{end}}{{end}}
               class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
        {{.Nama}}{{if .Deskripsi.Valid}} <span class="text-gray-400 text-xs">— {{.Deskripsi.String}}</span>{{end}}
      </label>
      {{end}}
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Catatan</label>
    <textarea name="catatan" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">{{.Form.Catatan}}</textarea>
  </div>

  <div class="flex gap-3 pt-2">
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2 rounded-lg">Simpan</button>
    <a href="/pelayan" class="text-sm text-gray-600 hover:text-gray-900 px-3 py-2">Batal</a>
  </div>
</form>
</div>
{{end}}
