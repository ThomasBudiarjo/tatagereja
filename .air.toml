root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "bin", "data", "frontend", "node_modules"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
