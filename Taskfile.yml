version: '3'

vars:
  BIN: bin/server
  DB_PATH: '{{.DB_PATH | default "./tatagereja.db"}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  deps:
    desc: Install frontend and backend dependencies
    cmds:
      - cd web && npm install
      - go mod tidy

  fe:build:
    desc: Build the SolidJS frontend into web/dist
    cmds:
      - cd web && npm run build

  fe:dev:
    desc: Run the Vite dev server (proxies /api to :8080)
    cmds:
      - cd web && npm run dev

  build:
    desc: Build frontend and compile the Go binary
    deps: [fe:build]
    cmds:
      - go build -o {{.BIN}} ./cmd/server

  run:
    desc: Build everything and run the server locally
    deps: [build]
    cmds:
      - DATABASE_PATH={{.DB_PATH}} ./{{.BIN}}

  dev:
    desc: Run the Go API only (use with fe:dev for live reload)
    cmds:
      - DATABASE_PATH={{.DB_PATH}} go run ./cmd/server

  check:
    desc: Vet and build all Go packages
    cmds:
      - go vet ./...
      - go build ./...

  clean:
    desc: Remove build artifacts and the local database
    cmds:
      - rm -rf bin
      - rm -f tatagereja.db tatagereja.db-wal tatagereja.db-shm
