{{define "pelayan/detail.html"}}
<div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
  <div>
    <a href="/pelayan" class="link link-hover text-sm text-base-content/60">Kembali ke daftar</a>
    <h1 class="mt-2 text-2xl font-bold">{{.JemaatNama}}</h1>
    <p class="text-sm text-base-content/60">Pelayan</p>
  </div>
  <div class="flex gap-2">
    <a href="/pelayan/{{.Pelayan.ID}}/edit" class="btn btn-outline">Ubah</a>
    <form method="POST" action="/pelayan/{{.Pelayan.ID}}">
      <input type="hidden" name="_method" value="DELETE">
      <button type="submit" class="btn btn-error btn-outline"
        onclick="return confirm('Hapus pelayan ini?')">Hapus</button>
    </form>
  </div>
</div>

<dl class="card card-border bg-base-100 shadow-sm">
  <div class="card-body p-4 md:p-6">
    <div class="mb-4">
      <dt class="text-xs font-semibold uppercase tracking-wide text-base-content/50">Jemaat</dt>
      <dd class="mt-1"><a href="/jemaat/{{.Pelayan.JemaatID}}" class="link link-primary text-sm font-medium">{{.JemaatNama}}</a></dd>
    </div>
    <div class="mb-4">
      <dt class="text-xs font-semibold uppercase tracking-wide text-base-content/50">Tipe pelayanan</dt>
      <dd class="mt-2 flex flex-wrap gap-2">
        {{range .ServiceTypeNames}}
        <span class="badge badge-primary badge-soft">{{.}}</span>
        {{else}}
        <span class="text-sm text-base-content/60">Belum ada tipe pelayanan.</span>
        {{end}}
      </dd>
    </div>
    <div>
      <dt class="text-xs font-semibold uppercase tracking-wide text-base-content/50">Catatan</dt>
      <dd class="mt-1 whitespace-pre-wrap text-sm">{{if .Pelayan.Catatan.Valid}}{{derefString .Pelayan.Catatan}}{{else}}-{{end}}</dd>
    </div>
  </div>
</dl>
{{end}}
