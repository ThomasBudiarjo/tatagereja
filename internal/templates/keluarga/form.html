{{define "keluarga/form.html"}}
<div class="mb-5">
  <a href="/keluarga" class="text-[13px] text-[#8a8d87] hover:text-[#5a5d58] transition-colors">Kembali ke daftar</a>
  <h1 class="mt-2 text-[20px] font-bold text-[#2d2d30] tracking-tight">{{if .IsNew}}Tambah Keluarga{{else}}Ubah Keluarga{{end}}</h1>
</div>

<div id="form-container">
<form method="POST" action="{{if .IsNew}}/keluarga{{else}}/keluarga/{{.Form.ID}}{{end}}"
  {{if not .IsNew}}hx-post="/keluarga/{{.Form.ID}}" hx-target="#form-container" hx-swap="outerHTML"{{end}}
  class="max-w-2xl bg-white rounded-2xl border border-[#e5e6e2] shadow-[0_2px_8px_rgba(0,0,0,0.04),0_1px_2px_rgba(0,0,0,0.02)] p-4 md:p-6 space-y-4">

  {{if not .IsNew}}
  <input type="hidden" name="_method" value="PUT">
  {{end}}

  <div>
    <label for="nama_keluarga" class="block text-xs font-semibold text-[#3d4039] mb-1.5">Nama keluarga <span class="text-rose-500">*</span></label>
    <input type="text" id="nama_keluarga" name="nama_keluarga" value="{{.Form.NamaKeluarga}}" required maxlength="200"
      class="w-full px-3.5 py-1.5 bg-white border rounded-lg text-sm transition-all focus:outline-none focus:ring-2 {{if index .Errors `NamaKeluarga`}}border-rose-300 focus:border-rose-500 focus:ring-rose-500/20{{else}}border-[#d6d8d2] focus:border-[#4a6138] focus:ring-[#5a7546]/10{{end}}">
    {{with index .Errors "NamaKeluarga"}}
    <p class="mt-1.5 text-xs font-medium text-rose-500 flex items-center gap-1">
      <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
      {{.}}
    </p>
    {{end}}
  </div>

  <div>
    <label for="alamat" class="block text-xs font-semibold text-[#3d4039] mb-1.5">Alamat</label>
    <textarea id="alamat" name="alamat" rows="2" maxlength="500"
      class="w-full px-3.5 py-1.5 bg-white border border-[#d6d8d2] rounded-lg text-sm transition-all focus:outline-none focus:ring-2 focus:border-[#4a6138] focus:ring-[#5a7546]/10 {{if index .Errors `Alamat`}}border-rose-300{{end}}">{{.Form.Alamat}}</textarea>
    {{with index .Errors "Alamat"}}<p class="mt-1.5 text-xs font-medium text-rose-500">{{.}}</p>{{end}}
  </div>

  <div>
    <label for="catatan" class="block text-xs font-semibold text-[#3d4039] mb-1.5">Catatan</label>
    <textarea id="catatan" name="catatan" rows="3" maxlength="2000"
      class="w-full px-3.5 py-1.5 bg-white border border-[#d6d8d2] rounded-lg text-sm transition-all focus:outline-none focus:ring-2 focus:border-[#4a6138] focus:ring-[#5a7546]/10 {{if index .Errors `Catatan`}}border-rose-300{{end}}">{{.Form.Catatan}}</textarea>
    {{with index .Errors "Catatan"}}<p class="mt-1.5 text-xs font-medium text-rose-500">{{.}}</p>{{end}}
  </div>

  <div class="grid gap-2 border-t border-[#e5e6e2] pt-4 sm:grid-cols-2">
    <button type="submit" class="py-1.5 px-4 bg-[#5a7546] hover:bg-[#4a6138] active:scale-[0.98] disabled:opacity-60 disabled:pointer-events-none text-white font-semibold rounded-lg text-sm transition-all inline-flex items-center justify-center gap-1 shadow-sm cursor-pointer">
      <span class="htmx-indicator-hidden inline-flex items-center gap-1">Simpan</span>
      <span class="htmx-indicator inline-flex items-center gap-1">
        <svg class="animate-spin h-3.5 w-3.5" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        Menyimpan
      </span>
    </button>
    <a href="/keluarga" class="py-1.5 px-4 bg-white border border-[#d6d8d2] hover:bg-[#f0f2ee] active:scale-[0.98] text-[#3d4039] font-medium rounded-lg text-sm transition-all inline-flex items-center justify-center focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#5a7546]/10 focus-visible:border-[#4a6138]">Batal</a>
  </div>
</form>
</div>
{{end}}
