{{define "login.html"}}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — Tata Gereja</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-stone-50 px-4 text-slate-800 antialiased">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold tracking-tight text-slate-800">Tata Gereja</h1>
      <p class="mt-1 text-sm text-slate-500">Kelola jemaat dan jadwal pelayanan</p>
    </div>

    <div class="rounded-xl border border-stone-200 bg-white p-6 shadow-sm">
      <h2 class="mb-4 text-lg font-semibold text-slate-800">Masuk</h2>

      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label for="email" class="mb-1 block text-sm font-medium text-slate-700">Email</label>
          <input type="email" id="email" name="email" value="{{.Email}}" autocomplete="email" required
            class="block w-full min-h-11 rounded-lg border px-3 text-sm
              {{if index .Errors "Email"}}border-red-500 focus:border-red-500 focus:ring-red-500{{else}}border-stone-300 focus:border-slate-500 focus:ring-slate-500{{end}}">
          {{with index .Errors "Email"}}<p class="mt-1 text-xs text-red-600">{{.}}</p>{{end}}
        </div>

        <div>
          <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Kata sandi</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required
            class="block w-full min-h-11 rounded-lg border px-3 text-sm
              {{if index .Errors "Password"}}border-red-500 focus:border-red-500 focus:ring-red-500{{else}}border-stone-300 focus:border-slate-500 focus:ring-slate-500{{end}}">
          {{with index .Errors "Password"}}<p class="mt-1 text-xs text-red-600">{{.}}</p>{{end}}
        </div>

        <button type="submit" class="flex min-h-11 w-full items-center justify-center rounded-lg bg-slate-800 px-4 text-sm font-semibold text-white hover:bg-slate-700">
          Masuk
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-slate-400">tatagereja.id</p>
  </div>
</body>
</html>
{{end}}
