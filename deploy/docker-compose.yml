# Self-hosting TataGereja: one container serving the API and the web app.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
services:
  tatagereja:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tatagereja:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Public URL of this server. Used to build invitation links and QR codes.
      APP_URL: ${APP_URL:-http://localhost:3000}
      SERVER_NAME: ${SERVER_NAME:-Our Church Server}
      # public | invite_only | disabled — invite_only is the recommended default.
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite_only}
      # Optional Cloudflare Turnstile bot protection for public registration.
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Browser origins allowed to call the API. Empty allows any origin.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
    volumes:
      - tatagereja-data:/data

volumes:
  tatagereja-data:
