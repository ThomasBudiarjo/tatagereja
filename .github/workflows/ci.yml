name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Reproducible build: npm ci honors the committed lockfile, and vite hashes
      # asset filenames by content, so unchanged source produces identical output.
      - name: Build SPA
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      # Staleness gate: the embedded SPA (internal/spa/dist) is committed and
      # consumed via go:embed. If a fresh build differs from what's committed,
      # someone changed frontend/ without running `make spa`. --porcelain catches
      # modified, deleted, and newly-hashed (untracked) asset files alike.
      - name: Verify embedded SPA build is up to date
        run: |
          if [ -n "$(git status --porcelain -- internal/spa/dist)" ]; then
            echo "::error::internal/spa/dist is stale — run 'make spa' and commit the result."
            git status --porcelain -- internal/spa/dist
            exit 1
          fi

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race -cover ./...
