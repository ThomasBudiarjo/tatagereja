name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The SPA build (internal/spa/dist) is not committed; it must exist before
      # any Go step because cmd/server embeds it via go:embed. npm ci honors the
      # committed lockfile for a reproducible build.
      - name: Build SPA
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race -cover ./...
